<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="ng" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="50%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#0f1620"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3d9cf0" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <radialGradient id="glow" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#7c5ce8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c5ce8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#ng)"/>
  <rect width="800" height="800" fill="url(#grid)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
