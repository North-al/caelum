<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="none">
  <defs>
    <linearGradient id="kraft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f0e6"/>
      <stop offset="100%" stop-color="#e8dcc8"/>
    </linearGradient>
    <pattern id="fiber" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#c8b8a4" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#kraft)"/>
  <rect width="800" height="800" fill="url(#fiber)"/>
</svg>
